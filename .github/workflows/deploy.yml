name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Path the app is served under; "/" for a custom domain
  BASE_HREF: /shelf-esteem/

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ng build --base-href "$BASE_HREF"
      # Pages has no rewrites: serve the app for deep links like /shelf/<id> as well
      - run: cp dist/shelf-esteem/browser/index.html dist/shelf-esteem/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/shelf-esteem/browser
      - id: deployment
        uses: actions/deploy-pages@v4
